<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片压缩器 - 本地无损压缩工具 | 图萌工具</title>
    <meta name="description" content="免费在线图片压缩工具，在浏览器本地压缩JPG/PNG/WebP图片，保护隐私，无需上传服务器。">
    <meta name="keywords" content="图片压缩,图片压缩器,本地压缩,PNG压缩,JPG压缩,在线工具">
    <link rel="stylesheet" href="assets/style-v2.css">
</head>
<body>
    <header>
        <div class="container header-inner">
            <a href="index.html" class="logo"><span>🔷</span>图萌工具</a>
            <nav><a href="index.html#tools">所有工具</a><a href="blog.html">博客</a></nav>
        </div>
    </header>
    <main>
        <div class="container">
            <a href="index.html" class="back-link">← 返回首页</a>
            <h1>图片压缩器</h1>
            <p class="subtitle">本地压缩图片，保护隐私，节省存储空间</p>
            <div class="qr-generator">
                <div class="qr-input-section">
                    <div class="form-group">
                        <label>选择图片</label>
                        <input type="file" id="image-input" accept="image/jpeg,image/png,image/webp,image/gif" style="padding:10px;border:2px dashed var(--border);border-radius:var(--radius-sm);width:100%;cursor:pointer;">
                    </div>
                    <div class="form-group">
                        <label>压缩质量: <span id="quality-value">80</span>%</label>
                        <input type="range" id="quality" min="10" max="100" value="80" style="width:100%">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>最大宽度 (px)</label>
                            <input type="number" id="max-width" value="1920" min="100" max="8000" step="100">
                        </div>
                        <div class="form-group">
                            <label>输出格式</label>
                            <select id="output-format">
                                <option value="image/jpeg">JPEG</option>
                                <option value="image/png">PNG</option>
                                <option value="image/webp">WebP</option>
                            </select>
                        </div>
                    </div>
                    <button class="generate-btn" onclick="compressImage()">开始压缩</button>
                    <div id="compression-result" style="margin-top:16px;font-size:0.9rem;color:var(--text-secondary);display:none">
                        <p>原始大小: <strong id="orig-size"></strong></p>
                        <p>压缩后: <strong id="comp-size"></strong></p>
                        <p>压缩率: <strong id="comp-rate" style="color:var(--success)"></strong></p>
                    </div>
                </div>
                <div class="qr-output-section">
                    <div id="image-result">
                        <canvas id="result-canvas" style="max-width:100%;border-radius:var(--radius-sm);box-shadow:var(--shadow-md)"></canvas>
                    </div>
                    <div class="qr-actions">
                        <button class="action-btn" onclick="downloadImage()">📥 下载压缩图片</button>
                    </div>
                    <div class="qr-info">图片在浏览器本地处理，不会上传到服务器</div>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <div class="container">
            <div class="footer-links"><a href="privacy.html">隐私政策</a><a href="terms.html">服务条款</a><a href="contact.html">联系我们</a></div>
            <p>&copy; 2026 图萌工具</p>
        </div>
    </footer>
    <script>
        let originalFile = null;
        let originalWidth = 0, originalHeight = 0;
        document.getElementById('quality').addEventListener('input', function(){ document.getElementById('quality-value').textContent = this.value; });
        document.getElementById('image-input').addEventListener('change', function(e){
            const file = e.target.files[0];
            if(!file) return;
            originalFile = file;
            const img = new Image();
            img.onload = function(){
                originalWidth = img.naturalWidth; originalHeight = img.naturalHeight;
                document.getElementById('compression-result').style.display = 'block';
                document.getElementById('orig-size').textContent = formatBytes(file.size);
                const canvas = document.getElementById('result-canvas');
                canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
            };
            img.src = URL.createObjectURL(file);
        });
        function compressImage() {
            if(!originalFile) { alert('请先选择图片'); return; }
            const quality = parseInt(document.getElementById('quality').value) / 100;
            const format = document.getElementById('output-format').value;
            const maxWidth = parseInt(document.getElementById('max-width').value);
            const img = new Image();
            img.onload = function(){
                const canvas = document.getElementById('result-canvas');
                let w = img.naturalWidth, h = img.naturalHeight;
                if(w > maxWidth) { h = h * maxWidth / w; w = maxWidth; }
                canvas.width = w; canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, w, h);
                canvas.toBlob(function(blob){
                    document.getElementById('comp-size').textContent = formatBytes(blob.size);
                    document.getElementById('comp-rate').textContent = Math.round((1 - blob.size/originalFile.size)*100) + '%';
                }, format, quality);
            };
            img.src = URL.createObjectURL(originalFile);
        }
        function downloadImage() {
            const canvas = document.getElementById('result-canvas');
            if(!canvas.width) { alert('请先压缩图片'); return; }
            const format = document.getElementById('output-format').value;
            const ext = format === 'image/png' ? 'png' : format === 'image/webp' ? 'webp' : 'jpg';
            const a = document.createElement('a'); a.download = 'compressed.' + ext; a.href = canvas.toDataURL(format); a.click();
        }
        function formatBytes(bytes) {
            if(bytes < 1024) return bytes + ' B';
            if(bytes < 1048576) return (bytes/1024).toFixed(1) + ' KB';
            return (bytes/1048576).toFixed(2) + ' MB';
        }
    </script>
</body>
</html>
